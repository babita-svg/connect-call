name: connectcall
description: "ConnectCall - Flutter voice & video calling app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  firebase_messaging: ^14.0.0
  flutter_local_notifications: ^15.0.0
  cloud_firestore: ^4.17.5
  agora_uikit: ^1.3.9
  agora_rtc_engine: ^6.3.3
  permission_handler: ^11.3.1
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true